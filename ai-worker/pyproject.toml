[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owniverse-ai-worker"
version = "0.1.0"
description = "OWNIVERSE AI worker skeleton"
requires-python = ">=3.11"
dependencies = ["pika==1.4.1"]

[project.scripts]
owniverse-worker = "owniverse_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["owniverse_worker*"]
